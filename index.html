  <!-- Hidden JSON Import Input -->
  <input type="file" id="dbImportFileInput" accept=".json,application/json" class="hidden" onchange="handleImportDatabaseFile(event)" />

  <script>
    /**
     * ============================================================================
     * 1. БЕЗОПАСНОЕ ХРАНИЛИЩЕ, КРИПТОГРАФИЯ (SHA-256) И ЗАЩИТА ОТ ПЕРЕБОРА
     * ============================================================================
     */
    const DB_STORAGE_KEY = 'zagafox_relational_db_v2';
    const LAST_REMOTE_TS_KEY = 'zagafox_remote_db_ts_v1';
    const VISITOR_SESSION_KEY = 'zagafox_visitor_scoped_token_v2';
    const ADMIN_SESSION_KEY = 'zagafox_admin_auth_token_v2';
    const RATE_LIMIT_KEY = 'zagafox_rate_limit_v2';
    const VISITOR_STATS_KEY = 'zagafox_visitor_stats_v1';
    const SOUND_PREF_KEY = 'zagafox_sound_enabled_v1';

    const OPTION_LETTERS_RU = ['А', 'Б', 'В', 'Г', 'Д', 'Е'];

    const ADMIN_PLAIN_DEFAULT = 'Azi_181125';
    let ADMIN_PASSWORD_HASH = '';

    // Хранит недавно созданные/сброшенные пароли в памяти на время текущей сессии администратора
    const ephemeralPlainPasswords = new Map();

    // Безопасные обёртки для localStorage и sessionStorage
    function safeLocalGet(key) {
      try { return localStorage.getItem(key); } catch { return null; }
    }
    function safeLocalSet(key, val) {
      try { localStorage.setItem(key, val); } catch {}
    }
    function safeSessionGet(key) {
      try { return sessionStorage.getItem(key); } catch { return null; }
    }
    function safeSessionSet(key, val) {
      try { sessionStorage.setItem(key, val); } catch {}
    }
    function safeSessionRemove(key) {
      try { sessionStorage.removeItem(key); } catch {}
    }

    function getOptionLetter(idx) {
      return OPTION_LETTERS_RU[idx] || String(idx + 1);
    }

    function formatDuration(totalSeconds) {
      const sec = Math.max(0, Math.floor(totalSeconds || 0));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const pad = n => String(n).padStart(2, '0');
      return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    }

    // Синтезатор звуковых эффектов (Web Audio API)
    let soundEnabled = safeLocalGet(SOUND_PREF_KEY) !== 'false';
    let audioCtx = null;

    function playSynthTone(type) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.14);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'wrong') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.18);
          gain.gain.setValueAtTime(0.13, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.start(now);
          osc.stop(now + 0.24);
        } else if (type === 'finish') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(554.37, now + 0.1);
          osc.frequency.setValueAtTime(659.25, now + 0.2);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.4);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.start(now);
          osc.stop(now + 0.06);
        }
      } catch (e) {}
    }

    function toggleSoundFx() {
      soundEnabled = !soundEnabled;
      safeLocalSet(SOUND_PREF_KEY, String(soundEnabled));
      if (soundEnabled) playSynthTone('click');
      updateHeaderState();
      showToast(soundEnabled ? 'Звуковые эффекты включены' : 'Звуковые эффекты выключены', 'info');
    }

    function getVisitorStats(panelId) {
      try {
        const raw = safeLocalGet(VISITOR_STATS_KEY);
        const all = raw ? JSON.parse(raw) : {};
        return all[panelId] || { attempts: 0, bestCorrect: 0, bestTotal: 0, bestPct: null };
      } catch {
        return { attempts: 0, bestCorrect: 0, bestTotal: 0, bestPct: null };
      }
    }

    function recordVisitorAttempt(panelId, correct, total) {
      try {
        const raw = safeLocalGet(VISITOR_STATS_KEY);
        const all = raw ? JSON.parse(raw) : {};
        const prev = all[panelId] || { attempts: 0, bestCorrect: 0, bestTotal: 0, bestPct: null };
        const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
        prev.attempts += 1;
        if (prev.bestPct === null || pct > prev.bestPct || (pct === prev.bestPct && correct > prev.bestCorrect)) {
          prev.bestPct = pct;
          prev.bestCorrect = correct;
          prev.bestTotal = total;
        }
        all[panelId] = prev;
        safeLocalSet(VISITOR_STATS_KEY, JSON.stringify(all));
      } catch (e) {}
    }

    async function sha256Hex(plainText) {
      const data = new TextEncoder().encode(plainText);
      if (window.crypto && window.crypto.subtle) {
        const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer))
          .map(b => b.toString(16).padStart(2, '0'))
          .join('');
      }
      const salted = `zagafox_salt_${plainText}`;
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < salted.length; i++) {
        const ch = salted.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).padStart(16, '0');
    }

    function getVisitorSession() {
      try {
        const raw = safeSessionGet(VISITOR_SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function lockVisitorSession() {
      stopExamTimer();
      safeSessionRemove(VISITOR_SESSION_KEY);
      activeExam = null;
      selectedFileIdForRange = null;
      showToast('Вы вышли из панели.', 'info');
      navigateTo('/');
    }

    function isAdminAuthenticated() {
      return safeSessionGet(ADMIN_SESSION_KEY) === 'ACTIVE_ADMIN_TOKEN';
    }

    function setAdminAuthenticated(state) {
      if (state) {
        safeSessionSet(ADMIN_SESSION_KEY, 'ACTIVE_ADMIN_TOKEN');
      } else {
        safeSessionRemove(ADMIN_SESSION_KEY);
      }
    }

    function getRateLimitState(scope = 'visitor') {
      try {
        const raw = safeSessionGet(`${RATE_LIMIT_KEY}_${scope}`);
        return raw ? JSON.parse(raw) : { attempts: 0, lockoutUntil: 0 };
      } catch {
        return { attempts: 0, lockoutUntil: 0 };
      }
    }

    function recordFailedAttempt(scope = 'visitor') {
      const state = getRateLimitState(scope);
      state.attempts += 1;
      if (state.attempts >= 5) {
        state.lockoutUntil = Date.now() + 30000;
      }
      safeSessionSet(`${RATE_LIMIT_KEY}_${scope}`, JSON.stringify(state));
      return state;
    }

    function resetRateLimit(scope = 'visitor') {
      safeSessionRemove(`${RATE_LIMIT_KEY}_${scope}`);
    }

    async function serverVerifyPanelPassword(plainPassword) {
      const rl = getRateLimitState('visitor');
      if (rl.lockoutUntil && Date.now() < rl.lockoutUntil) {
        const rem = Math.ceil((rl.lockoutUntil - Date.now()) / 1000);
        return { ok: false, lockedOut: true, error: `Слишком много неверных попыток. Блокировка на ${rem} сек.` };
      }

      const trimmed = (plainPassword || '').trim();
      if (!trimmed) {
        return { ok: false, error: 'Введите пароль панели.' };
      }

      const candidateHash = await sha256Hex(trimmed);
      if (candidateHash === ADMIN_PASSWORD_HASH) {
        const updated = recordFailedAttempt('visitor');
        return {
          ok: false,
          lockedOut: updated.attempts >= 5,
          error: 'Неверный пароль панели.'
        };
      }

      const matchedPanel = DB.sections.find(s => s.password_hash === candidateHash);
      if (!matchedPanel) {
        const updated = recordFailedAttempt('visitor');
        const remAttempts = Math.max(0, 5 - updated.attempts);
        return {
          ok: false,
          lockedOut: updated.attempts >= 5,
          error: updated.attempts >= 5
            ? 'Превышен лимит попыток. Доступ заблокирован на 30 секунд.'
            : `Неверный пароль. Осталось попыток: ${remAttempts}.`
        };
      }

      if (!matchedPanel.password_enabled) {
        return { ok: false, error: 'Доступ по этому паролю отключён администратором.' };
      }

      if (matchedPanel.status !== 'Published') {
        return { ok: false, error: 'Данная панель ещё не опубликована.' };
      }

      resetRateLimit('visitor');
      const tokenPayload = {
        section_id: matchedPanel.id,
        section_number: matchedPanel.section_number,
        issued_at: Date.now()
      };
      safeSessionSet(VISITOR_SESSION_KEY, JSON.stringify(tokenPayload));
      return { ok: true, panelId: matchedPanel.id };
    }

    function serverGetAuthorizedPanel(requestedPanelId) {
      const session = getVisitorSession();
      if (!session || session.section_id !== requestedPanelId) {
        return { authorized: false, reason: 'Доступ запрещён. Введите пароль этой панели.' };
      }
      const panel = DB.sections.find(s => s.id === requestedPanelId);
      if (!panel) {
        return { authorized: false, reason: 'Панель не найдена.' };
      }
      if (!panel.password_enabled || panel.status !== 'Published') {
        return { authorized: false, reason: 'Панель отключена или скрыта администратором.' };
      }
      const files = DB.tests
        .filter(t => t.section_id === panel.id)
        .sort((a, b) => a.test_number - b.test_number)
        .map(t => ({
          id: t.id,
          section_id: t.section_id,
          test_number: t.test_number,
          title: t.title,
          file_name: t.file_name,
          description: t.description,
          question_count: DB.questions.filter(q => q.test_id === t.id).length
        }));
      return { authorized: true, panel, files };
    }

    function buildQuestionRanges(totalCount) {
      const ranges = [];
      for (let start = 1; start <= totalCount; start += 50) {
        const end = Math.min(start + 49, totalCount);
        ranges.push({
          key: `${start}-${end}`,
          label: `${start}–${end}`,
          start,
          end,
          count: end - start + 1
        });
      }
      return ranges;
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /**
     * ============================================================================
     * 2. УНИВЕРСАЛЬНЫЙ ПАРСЕР WORD (.docx / .doc / .rtf) И .txt
     *    Любой формат теста: 1 вопрос + 5 ответов, вариант А (индекс 0) всегда правильный
     * ============================================================================
     */
    function stripQuestionPrefix(text) {
      return text
        .replace(/^\s*(?:вопрос\s*)?(?:№\s*)?\d{1,4}\s*(?:[-–—.]|\)|-сұрақ)?\s*/i, '')
        .replace(/^\s*<question>\s*/i, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function stripOptionPrefix(text) {
      return text
        .replace(/^\s*<variant(?:right)?>\s*/i, '')
        .replace(/^\s*(?:[АаAaБбВвBbГгСсCcДдDdЕеEeФфFf]\s*[.):\-–—]|[•●▪◦*\-–—+]|\d{1,2}\s*[.)])\s*/, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function parseTagBasedQuestions(cleaned) {
      if (!/<question>/i.test(cleaned) || !/<variant/i.test(cleaned)) return [];
      const parts = cleaned.split(/<question>/i).slice(1);
      const parsed = [];
      parts.forEach((part, idx) => {
        const chunks = part.split(/<variant(?:right)?>/i);
        const qText = stripQuestionPrefix(chunks[0] || '');
        const opts = chunks.slice(1)
          .map(c => c.replace(/\s+/g, ' ').trim())
          .filter(Boolean)
          .slice(0, 5);
        if (qText && opts.length >= 2) {
          parsed.push({
            original_question_number: idx + 1,
            question_text: qText,
            answer_options: opts,
            correct_answer: 0
          });
        }
      });
      return parsed;
    }

    function parseNumberedLetteredQuestions(cleaned) {
      const blocks = cleaned
        .split(/(?=(?:^|[\n\r]|(?<=[а-яёәғқңөұүһіa-z0-9.,;:!?()\-–—"'»])\s+)(?:№\s*)?\d{1,4}[.)]\s*)/gi)
        .map(b => b.trim())
        .filter(Boolean);
      const parsed = [];

      for (const block of blocks) {
        const numMatch = block.match(/^(?:№\s*)?(\d{1,4})[.)]\s*([\s\S]*)$/);
        if (!numMatch) continue;
        const origNum = parseInt(numMatch[1], 10);
        const body = numMatch[2].trim();

        const optRegex = /(?:^|(?<=[\s\n.,;:!?()\-–—"'»0-9a-zа-яёәғқңөұүһі]))([АаAaБбВвBbГгСсCcDдДdЕеEeFфФf])[.)]\s*/g;
        const rawMarkers = [];
        let m;
        while ((m = optRegex.exec(body)) !== null) {
          rawMarkers.push({
            letter: m[1].toUpperCase(),
            index: m.index,
            contentStart: m.index + m[0].length
          });
        }

        const firstAIdx = rawMarkers.findIndex(mk => mk.letter === 'А' || mk.letter === 'A');
        if (firstAIdx === -1) continue;

        const markers = [rawMarkers[firstAIdx]];
        const hasRussianB = rawMarkers.slice(firstAIdx + 1).some(mk => mk.letter === 'Б');
        const expectedOrder = hasRussianB
          ? [
              ['А', 'A'],
              ['Б'],
              ['В', 'B'],
              ['Г'],
              ['Д', 'D'],
              ['Е', 'E']
            ]
          : [
              ['А', 'A'],
              ['В', 'B'],
              ['С', 'C'],
              ['D', 'Д'],
              ['Е', 'E'],
              ['F', 'Ф']
            ];

        for (let k = firstAIdx + 1; k < rawMarkers.length; k++) {
          const nextSlot = markers.length;
          if (nextSlot >= expectedOrder.length) break;
          if (expectedOrder[nextSlot].includes(rawMarkers[k].letter)) {
            markers.push(rawMarkers[k]);
          }
        }

        if (markers.length < 2) continue;

        const questionText = body.slice(0, markers[0].index).replace(/\s+/g, ' ').trim();
        const options = [];
        for (let i = 0; i < markers.length; i++) {
          const start = markers[i].contentStart;
          const end = i + 1 < markers.length ? markers[i + 1].index : body.length;
          const optText = body.slice(start, end).replace(/\s+/g, ' ').trim();
          if (optText) {
            options.push(optText);
          }
        }

        if (questionText && options.length >= 2) {
          parsed.push({
            original_question_number: origNum,
            question_text: questionText,
            answer_options: options.slice(0, 5),
            correct_answer: 0
          });
        }
      }

      return parsed;
    }

    function parseUnnumberedLetteredQuestions(cleaned) {
      const lines = cleaned.split('\n').map(l => l.trim()).filter(Boolean);
      const optStartRe = /^([АаAaБбВвBbГгСсCcДдDdЕеEe])[.)]\s*(.+)$/;
      const parsed = [];
      let currentQ = [];
      let currentOpts = [];

      const flush = () => {
        const qText = stripQuestionPrefix(currentQ.join(' '));
        if (qText && currentOpts.length >= 2) {
          parsed.push({
            original_question_number: parsed.length + 1,
            question_text: qText,
            answer_options: currentOpts.slice(0, 5),
            correct_answer: 0
          });
        }
        currentQ = [];
        currentOpts = [];
      };

      for (const line of lines) {
        const om = line.match(optStartRe);
        if (om) {
          const letter = om[1].toUpperCase();
          if ((letter === 'А' || letter === 'A') && currentOpts.length >= 2) {
            flush();
          }
          currentOpts.push(om[2].replace(/\s+/g, ' ').trim());
        } else {
          if (currentOpts.length >= 2) {
            flush();
          }
          currentQ.push(line);
        }
      }
      flush();
      return parsed;
    }

    function parseBlankLineBlocks(cleaned) {
      const groups = cleaned
        .split(/\n\s*\n+/)
        .map(g => g.split('\n').map(l => l.trim()).filter(Boolean))
        .filter(lines => lines.length >= 3 && lines.length <= 7);

      const parsed = [];
      groups.forEach((lines) => {
        const qText = stripQuestionPrefix(lines[0]);
        const opts = lines.slice(1, 6).map(stripOptionPrefix).filter(Boolean);
        if (qText && opts.length >= 2) {
          parsed.push({
            original_question_number: parsed.length + 1,
            question_text: qText,
            answer_options: opts,
            correct_answer: 0
          });
        }
      });
      return parsed;
    }

    function parseUniversalSixLineBlocks(cleaned) {
      const lines = cleaned.split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length < 3) return [];

      // Если в начале документа есть 1-2 строки заголовка, а затем ровно группы по 6 строк (1 вопрос + 5 ответов)
      let startOffset = 0;
      const rem = lines.length % 6;
      if (lines.length >= 7 && rem > 0 && rem <= 2) {
        const firstLooksLikeQ = /[?:]$/.test(lines[0]) || /^\d+[.)]/.test(lines[0]);
        const shiftedLooksLikeQ = /[?:]$/.test(lines[rem]) || /^\d+[.)]/.test(lines[rem]);
        if (!firstLooksLikeQ && shiftedLooksLikeQ) {
          startOffset = rem;
        }
      }

      const parsed = [];
      for (let i = startOffset; i < lines.length; i += 6) {
        const slice = lines.slice(i, i + 6);
        if (slice.length < 3) break;
        const qText = stripQuestionPrefix(slice[0]) || slice[0];
        const opts = slice.slice(1, 6).map(s => stripOptionPrefix(s) || s).filter(Boolean);
        if (qText && opts.length >= 2) {
          parsed.push({
            original_question_number: parsed.length + 1,
            question_text: qText,
            answer_options: opts,
            correct_answer: 0
          });
        }
      }
      return parsed;
    }

    function parseTestQuestionsFromRawText(rawText) {
      const cleaned = (rawText || '')
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n')
        .replace(/[\u00A0\u200B\uFEFF]/g, ' ')
        .trim();

      if (!cleaned) return [];

      // 1. Теги <question> / <variant> (Platonus и аналоги)
      const tagRes = parseTagBasedQuestions(cleaned);
      if (tagRes.length > 0) return tagRes;

      // 2. Классический формат с нумерацией и буквами вариантов
      const numberedRes = parseNumberedLetteredQuestions(cleaned);

      // 3. Вопросы без номеров, но с буквенными вариантами А/A..Е/E
      const unnumberedRes = parseUnnumberedLetteredQuestions(cleaned);

      // 4. Блоки, разделённые пустой строкой (1 вопрос + 5 ответов)
      const blankBlockRes = parseBlankLineBlocks(cleaned);

      // 5. Универсальный резервный режим: любые 6 непустых строк подряд = 1 вопрос + 5 ответов
      const sixLineRes = parseUniversalSixLineBlocks(cleaned);

      const bestStructured = [numberedRes, unnumberedRes, blankBlockRes]
        .sort((a, b) => b.length - a.length)[0];

      // Если структурированный парсер нашёл достаточно вопросов — используем его;
      // иначе (например, встроенные автосписки Word без текста «1.» и «А)») берём универсальный 1+5
      if (bestStructured.length > 0 && bestStructured.length >= Math.floor(sixLineRes.length * 0.5)) {
        return bestStructured;
      }
      return sixLineRes.length > 0 ? sixLineRes : bestStructured;
    }

    function stripRtfToPlainText(rtf) {
      return rtf
        .replace(/\\par[d]?\b/g, '\n')
        .replace(/\\line\b/g, '\n')
        .replace(/\\tab\b/g, ' ')
        .replace(/\\u(-?\d+)\??/g, (_, code) => {
          const n = parseInt(code, 10);
          return String.fromCharCode(n < 0 ? n + 65536 : n);
        })
        .replace(/\\'[0-9a-fA-F]{2}/g, (m) => {
          const byte = parseInt(m.slice(2), 16);
          try {
            return new TextDecoder('windows-1251').decode(new Uint8Array([byte]));
          } catch {
            return '';
          }
        })
        .replace(/\\[a-z]+-?\d* ?/gi, '')
        .replace(/[{}]/g, '')
        .trim();
    }

    function extractStringsFromLegacyDoc(arrayBuffer) {
      // Попытка извлечь текст из бинарного .doc (UTF-16LE или CP1251/UTF-8)
      const bytes = new Uint8Array(arrayBuffer);
      let utf16Text = '';
      try {
        const decoded = new TextDecoder('utf-16le', { fatal: false }).decode(bytes);
        const matches = decoded.match(/[А-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІіA-Za-z0-9.,;:!?()\-–—"'«»\s]{8,}/g) || [];
        utf16Text = matches
          .map(s => s.replace(/\r/g, '\n').trim())
          .filter(s => /[А-Яа-яЁёA-Za-z]{2,}/.test(s))
          .join('\n');
      } catch {}

      if (utf16Text.split('\n').filter(Boolean).length >= 6) {
        return utf16Text;
      }

      try {
        const decoded1251 = new TextDecoder('windows-1251', { fatal: false }).decode(bytes);
        const matches = decoded1251.match(/[А-Яа-яЁёA-Za-z0-9.,;:!?()\-–—"'«»\s]{8,}/g) || [];
        return matches
          .map(s => s.replace(/\r/g, '\n').trim())
          .filter(s => /[А-Яа-яЁёA-Za-z]{2,}/.test(s))
          .join('\n');
      } catch {
        return utf16Text;
      }
    }

    async function extractTextFromUploadedFile(file) {
      const name = file.name.toLowerCase();
      const arrayBuffer = await file.arrayBuffer();

      // 1. Попытка открыть как ZIP / DOCX (работает для .docx и переименованных .doc в формате OOXML)
      if (window.JSZip && (name.endsWith('.docx') || name.endsWith('.doc'))) {
        try {
          const zip = await JSZip.loadAsync(arrayBuffer);
          const docXmlFile = zip.file('word/document.xml');
          if (docXmlFile) {
            const xmlString = await docXmlFile.async('string');
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlString, 'application/xml');
            const paragraphs = Array.from(xmlDoc.getElementsByTagName('w:p'));
            const lines = paragraphs.map(p => {
              let line = '';
              const walker = xmlDoc.createTreeWalker(p, NodeFilter.SHOW_ELEMENT, null);
              let node;
              while ((node = walker.nextNode())) {
                if (node.nodeName === 'w:t') {
                  line += node.textContent;
                } else if (node.nodeName === 'w:br' || node.nodeName === 'w:cr') {
                  line += '\n';
                } else if (node.nodeName === 'w:tab') {
                  line += ' ';
                }
              }
              return line;
            });
            return lines.join('\n');
          }
        } catch (zipErr) {
          // Если это не ZIP-архив (например, старый .doc, RTF или HTML-Word) — переходим к резервным форматам
        }
      }

      // 2. Проверка текстовых / RTF / HTML-Word форматов
      const rawUtf8 = new TextDecoder('utf-8', { fatal: false }).decode(arrayBuffer);
      if (rawUtf8.trimStart().startsWith('{\\rtf')) {
        return stripRtfToPlainText(rawUtf8);
      }
      if (/<(?:html|body|p|div|table)\b/i.test(rawUtf8.slice(0, 2000))) {
        const doc = new DOMParser().parseFromString(rawUtf8, 'text/html');
        return (doc.body && doc.body.innerText) ? doc.body.innerText : (doc.body ? doc.body.textContent : rawUtf8);
      }

      // 3. Старый бинарный Word 97–2003 (.doc)
      if (name.endsWith('.doc')) {
        return extractStringsFromLegacyDoc(arrayBuffer);
      }

      // 4. Обычный текстовый файл (.txt)
      return rawUtf8;
    }

    /**
     * ============================================================================
     * 3. РЕЛЯЦИОННАЯ БАЗА ДАННЫХ (Панели -> Тестовые файлы [макс. 8] -> Вопросы)
     * ============================================================================
     */
    let DB = {
      sections: [],
      tests: [],
      questions: [],
      updated_at_ts: 0
    };
    let remoteDbStatus = 'unknown'; // 'synced' | 'missing' | 'unknown'

    function formatDateDDMMYYYY(date = new Date()) {
      const dd = String(date.getDate()).padStart(2, '0');
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const yyyy = date.getFullYear();
      return `${dd}.${mm}.${yyyy}`;
    }

    function generateId(prefix) {
      return `${prefix}_${Math.random().toString(36).substring(2, 9)}_${Date.now().toString(36)}`;
    }

    function saveDatabase(preserveTimestamp = false) {
      DB.tests.forEach(t => {
        t.question_count = DB.questions.filter(q => q.test_id === t.id).length;
      });
      if (!preserveTimestamp) {
        DB.updated_at_ts = Date.now();
      }
      safeLocalSet(DB_STORAGE_KEY, JSON.stringify(DB));
    }

    async function buildSeedDatabase() {
      DB = {
        sections: [],
        tests: [],
        questions: [],
        updated_at_ts: 0
      };
      saveDatabase(true);
    }

    async function syncFromRemoteDbJson(forceOverwrite = false) {
      if (window.location.protocol !== 'https:' && window.location.protocol !== 'http:') {
        return { ok: false, reason: 'local' };
      }
      try {
        const resp = await fetch(`./db.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!resp.ok) {
          remoteDbStatus = 'missing';
          return { ok: false, reason: 'not_found' };
        }
        const remoteData = await resp.json();
        if (!remoteData || !Array.isArray(remoteData.sections) || !Array.isArray(remoteData.tests) || !Array.isArray(remoteData.questions)) {
          remoteDbStatus = 'missing';
          return { ok: false, reason: 'invalid' };
        }

        const remoteTs = Number(remoteData.updated_at_ts) || 1;
        const lastSyncedTs = Number(safeLocalGet(LAST_REMOTE_TS_KEY) || 0);
        const localTs = Number(DB.updated_at_ts || 0);
        const isLocalEmpty = DB.sections.length === 0 && DB.tests.length === 0 && DB.questions.length === 0;

        const shouldApply = forceOverwrite ||
          isLocalEmpty ||
          remoteTs > localTs ||
          (!isAdminAuthenticated() && remoteTs !== lastSyncedTs);

        if (shouldApply) {
          DB = {
            sections: remoteData.sections,
            tests: remoteData.tests,
            questions: remoteData.questions,
            updated_at_ts: remoteTs
          };
          saveDatabase(true);
          safeLocalSet(LAST_REMOTE_TS_KEY, String(remoteTs));
        }

        remoteDbStatus = 'synced';
        return { ok: true, applied: shouldApply };
      } catch {
        remoteDbStatus = 'missing';
        return { ok: false, reason: 'network' };
      }
    }

    async function manualSyncFromRemoteDb() {
      const res = await syncFromRemoteDbJson(true);
      if (res.ok) {
        ephemeralPlainPasswords.clear();
        showToast(`База обновлена из db.json (панелей: ${DB.sections.length}, вопросов: ${DB.questions.length}).`, 'success');
        renderApp();
      } else {
        showToast('Файл db.json ещё не найден в репозитории рядом с index.html.', 'error');
      }
    }

    async function initDatabase() {
      ADMIN_PASSWORD_HASH = await sha256Hex(ADMIN_PLAIN_DEFAULT);
      const saved = safeLocalGet(DB_STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (!parsed || !Array.isArray(parsed.sections) || !Array.isArray(parsed.tests) || !Array.isArray(parsed.questions)) {
            throw new Error('Повреждённая структура базы');
          }
          DB = parsed;
        } catch {
          await buildSeedDatabase();
        }
      } else {
        await buildSeedDatabase();
      }

      // Автоматически подгружаем общий db.json из репозитория GitHub Pages
      await syncFromRemoteDbJson(false);
    }

    /**
     * Экспорт и импорт базы данных (db.json)
     */
    function exportDatabaseJson() {
      try {
        const exportTs = Date.now();
        DB.updated_at_ts = exportTs;
        saveDatabase(true);
        const payload = {
          app: 'ZAGAFOX',
          version: 2,
          updated_at_ts: exportTs,
          exported_at: new Date(exportTs).toISOString(),
          sections: DB.sections,
          tests: DB.tests,
          questions: DB.questions
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'db.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast(`Файл db.json скачан (панелей: ${DB.sections.length}, вопросов: ${DB.questions.length}). Загрузите его в репозиторий GitHub рядом с index.html.`, 'success');
      } catch (err) {
        showToast(`Не удалось экспортировать базу: ${err.message}`, 'error');
      }
    }

    function triggerImportDatabase() {
      const inp = document.getElementById('dbImportFileInput');
      if (inp) {
        inp.value = '';
        inp.click();
      }
    }

    async function handleImportDatabaseFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (!data || !Array.isArray(data.sections) || !Array.isArray(data.tests) || !Array.isArray(data.questions)) {
          showToast('Неверный формат файла резервной копии JSON.', 'error');
          return;
        }

        openConfirmModal({
          title: 'Импортировать базу данных?',
          message: `В файле найдено: панелей — ${data.sections.length}, тестовых файлов — ${data.tests.length}, вопросов — ${data.questions.length}. Текущая база в этом браузере будет полностью заменена.`,
          confirmText: 'Импортировать и заменить',
          confirmVariant: 'primary',
          onConfirm: () => {
            DB = {
              sections: data.sections,
              tests: data.tests,
              questions: data.questions
            };
            ephemeralPlainPasswords.clear();
            safeSessionRemove(VISITOR_SESSION_KEY);
            saveDatabase();
            showToast(`База успешно импортирована (${DB.sections.length} панелей, ${DB.questions.length} вопросов).`, 'success');
            navigateTo('/admin');
          }
        });
      } catch (err) {
        showToast(`Ошибка чтения JSON-файла: ${err.message}`, 'error');
      }
    }

    /**
     * Формирование сессии тестирования
     */
    function serverCreateConfiguredExamSession(testId, config) {
      const session = getVisitorSession();
      if (!session) return { authorized: false, reason: 'Требуется авторизация по паролю панели.' };

      const file = DB.tests.find(t => t.id === testId);
      if (!file || file.section_id !== session.section_id) {
        return { authorized: false, reason: 'Доступ запрещён: тест принадлежит другой панели.' };
      }

      const panel = DB.sections.find(s => s.id === file.section_id);
      if (!panel || !panel.password_enabled || panel.status !== 'Published') {
        return { authorized: false, reason: 'Панель недоступна.' };
      }

      const allQs = DB.questions
        .filter(q => q.test_id === file.id)
        .sort((a, b) => a.original_question_number - b.original_question_number);

      let pool = allQs.slice(config.rangeStart - 1, config.rangeEnd);
      if (pool.length === 0) {
        return { authorized: false, reason: 'В выбранном блоке нет вопросов.' };
      }

      if (config.shuffleQuestions || config.questionLimit !== 'ALL') {
        pool = shuffleArray(pool);
      }

      if (config.questionLimit !== 'ALL') {
        const cap = Number(config.questionLimit);
        if (cap > 0 && pool.length > cap) {
          pool = pool.slice(0, cap);
        }
      }

      const preparedQuestions = pool.map((q, idx) => {
        const optionObjects = q.answer_options.map((text, optIdx) => ({
          text,
          isCorrect: optIdx === (q.correct_answer ?? 0)
        }));

        const finalOptions = config.shuffleOptions ? shuffleArray(optionObjects) : optionObjects;

        return {
          exam_seq: idx + 1,
          question_id: q.id,
          question_text: q.question_text,
          options: finalOptions
        };
      });

      return {
        authorized: true,
        panel,
        file,
        questions: preparedQuestions
      };
    }

    /**
     * ============================================================================
     * 4. МАРШРУТИЗАТОР, ТАЙМЕР И СОСТОЯНИЕ ИНТЕРФЕЙСА
     * ============================================================================
     */
    let currentRoute = '/';
    let selectedFileIdForRange = null;
    let selectedRangeKey = '1-50';
    let selectedCheckMode = 'instant'; // 'instant' | 'exam'
    let selectedQuestionLimit = 'ALL'; // 'ALL' | '25' | '15' | '10'
    let selectedTimerMinutes = 0;      // 0 (без таймера) | 15 | 30 | 60
    let optShuffleQuestions = true;
    let optShuffleOptions = true;

    let activeExam = null;
    let examReviewFilter = 'all';      // 'all' | 'mistakes'
    let autoAdvanceTimer = null;
    let examTimerInterval = null;

    let adminActivePanelId = null;
    let adminSearchQuery = '';
    let adminQuestionSearchQuery = '';
    let adminQuestionPage = 1;
    let lockoutTimerInterval = null;

    function stopExamTimer() {
      if (examTimerInterval) {
        clearInterval(examTimerInterval);
        examTimerInterval = null;
      }
    }

    function startExamTimer() {
      stopExamTimer();
      if (!activeExam || activeExam.submitted) return;

      examTimerInterval = setInterval(() => {
        if (!activeExam || activeExam.submitted) {
          stopExamTimer();
          return;
        }
        const elapsed = Math.floor((Date.now() - activeExam.startedAt) / 1000);
        activeExam.elapsedSeconds = elapsed;

        const badgeEl = document.getElementById('examTimerBadge');
        if (activeExam.timerTotalSeconds > 0) {
          const remaining = Math.max(0, activeExam.timerTotalSeconds - elapsed);
          if (badgeEl) {
            badgeEl.textContent = `⏱ ${formatDuration(remaining)}`;
            if (remaining <= 60) {
              badgeEl.className = 'px-2.5 py-1 rounded-lg bg-rose-500/25 border border-rose-400/50 text-rose-200 font-bold animate-pulse';
            }
          }
          if (remaining <= 0) {
            stopExamTimer();
            finishAndGradeExam(true, true);
          }
        } else if (badgeEl) {
          badgeEl.textContent = `⏱ ${formatDuration(elapsed)}`;
        }
      }, 500);
    }

    function navigateTo(route) {
      if (lockoutTimerInterval) {
        clearInterval(lockoutTimerInterval);
        lockoutTimerInterval = null;
      }
      if (autoAdvanceTimer) {
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = null;
      }
      if (route !== '/exam') {
        stopExamTimer();
      }
      currentRoute = route;
      try {
        window.history.replaceState(null, '', `#${route}`);
      } catch (e) {}
      renderApp();
    }

    window.addEventListener('hashchange', () => {
      const h = window.location.hash.replace(/^#/, '') || '/';
      if (h !== currentRoute) {
        if (h !== '/exam') stopExamTimer();
        currentRoute = h;
        renderApp();
      }
    });

    function updateHeaderState() {
      const visitorSession = getVisitorSession();
      const exitBtn = document.getElementById('activeVisitorExitBtn');
      const subtitleEl = document.getElementById('headerDynamicSubtitle');
      const navAdminBtn = document.getElementById('navAdminBtn');
      const soundIcon = document.getElementById('soundToggleIcon');

      if (soundIcon) {
        soundIcon.innerHTML = soundEnabled
          ? `<svg class="w-4 h-4 text-purple-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>`
          : `<svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg>`;
      }

      if (visitorSession) {
        const panel = DB.sections.find(s => s.id === visitorSession.section_id);
        if (panel) {
          exitBtn.classList.remove('hidden');
          exitBtn.classList.add('flex');
          const activeFile = DB.tests.find(t => t.id === selectedFileIdForRange) || DB.tests.find(t => t.section_id === panel.id);
          const subjName = activeFile ? activeFile.title : panel.title;
          const blockDesc = selectedRangeKey === 'ALL' ? 'Все вместе' : `Блок ${selectedRangeKey}`;
          if (subtitleEl) {
            subtitleEl.textContent = `${subjName} • ${blockDesc} • Безлимитные попытки`;
          }
        } else {
          exitBtn.classList.add('hidden');
          exitBtn.classList.remove('flex');
        }
      } else {
        exitBtn.classList.add('hidden');
        exitBtn.classList.remove('flex');
        if (subtitleEl) {
          subtitleEl.textContent = 'Защищённая платформа тестирования';
        }
      }

      if (isAdminAuthenticated()) {
        navAdminBtn.innerHTML = `
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="hidden sm:inline">Админ (активна)</span>
        `;
      } else {
        navAdminBtn.innerHTML = `
          <svg class="w-4 h-4 text-fuchsia-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <span class="hidden sm:inline">Админ-панель</span>
        `;
      }
    }

    function renderApp() {
      updateHeaderState();
      const root = document.getElementById('appRoot');

      // 1. Маршруты Админ-панели
      if (currentRoute === '/admin' || currentRoute.startsWith('/admin/')) {
        if (!isAdminAuthenticated()) {
          renderAdminLoginView(root);
        } else if (currentRoute.startsWith('/admin/slot/')) {
          const fId = currentRoute.replace('/admin/slot/', '');
          renderAdminSlotQuestionsView(root, fId);
        } else if (currentRoute.startsWith('/admin/panel/')) {
          const pId = currentRoute.replace('/admin/panel/', '');
          adminActivePanelId = pId;
          renderAdminPanelSlotsView(root, pId);
        } else {
          renderAdminPanelsGridView(root);
        }
        return;
      }

      // 2. Активное прохождение теста / результаты
      if (currentRoute === '/exam' && activeExam) {
        renderVisitorExamView(root);
        return;
      }

      // 3. Разблокированная панель пользователя
      if (currentRoute.startsWith('/panel/')) {
        const pId = currentRoute.replace('/panel/', '');
        renderVisitorPanelWorkspace(root, pId);
        return;
      }

      // 4. Главная страница: если есть валидная сессия — открываем панель, иначе форма ввода пароля
      const existingSession = getVisitorSession();
      if (existingSession) {
        const validPanel = DB.sections.find(s => s.id === existingSession.section_id && s.status === 'Published' && s.password_enabled);
        if (validPanel) {
          renderVisitorPanelWorkspace(root, validPanel.id);
          return;
        } else {
          safeSessionRemove(VISITOR_SESSION_KEY);
        }
      }

      renderVisitorPasswordGateway(root);
    }

    /**
     * ============================================================================
     * 5. ВХОД ПОЛЬЗОВАТЕЛЯ ПО ПАРОЛЮ И НАСТРОЙКИ ТЕСТИРОВАНИЯ
     * ============================================================================
     */
    function renderVisitorPasswordGateway(root) {
      const rl = getRateLimitState('visitor');
      const isLocked = rl.lockoutUntil && Date.now() < rl.lockoutUntil;
      const remSecs = isLocked ? Math.ceil((rl.lockoutUntil - Date.now()) / 1000) : 0;

      root.innerHTML = `
        <div class="max-w-xl mx-auto mt-4 sm:mt-10 fade-in">
          <div class="text-center mb-6">
            <h1 class="text-3xl sm:text-4xl font-black tracking-tight bg-gradient-to-r from-white via-purple-200 to-fuchsia-300 bg-clip-text text-transparent">
              Доступ к тестовой панели
            </h1>
            <p class="text-slate-400 text-sm sm:text-base mt-2 max-w-md mx-auto">
              Введите пароль панели, чтобы открыть назначенные тесты.
            </p>
          </div>

          <div class="glass-card rounded-3xl p-6 sm:p-8 relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-48 h-48 rounded-full bg-fuchsia-600/20 blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -left-24 w-48 h-48 rounded-full bg-violet-600/20 blur-3xl pointer-events-none"></div>

            <form id="visitorUnlockForm" class="space-y-5 relative z-10">
              <div>
                <label for="panelPasswordInput" class="block text-xs font-bold uppercase tracking-wider text-purple-300 mb-2">
                  Пароль панели
                </label>
                <div class="relative">
                  <input
                    type="password"
                    id="panelPasswordInput"
                    autocomplete="off"
                    placeholder="Введите пароль доступа..."
                    ${isLocked ? 'disabled' : ''}
                    class="w-full px-4 py-4 pr-12 rounded-2xl bg-[#070510]/85 border border-purple-500/35 focus:border-fuchsia-400 focus:ring-2 focus:ring-purple-500/30 text-white placeholder-slate-500 font-mono text-base outline-none transition disabled:opacity-50"
                  />
                  <button
                    type="button"
                    onclick="togglePasswordVisibility('panelPasswordInput')"
                    class="absolute right-3.5 top-1/2 -translate-y-1/2 p-1.5 text-slate-400 hover:text-purple-300 rounded-lg cursor-pointer"
                    title="Показать / скрыть пароль"
                  >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                      <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                  </button>
                </div>
              </div>

              <div id="visitorErrorBox" class="${isLocked ? '' : 'hidden'} p-3.5 rounded-2xl bg-rose-500/15 border border-rose-500/40 text-rose-200 text-xs sm:text-sm flex items-start gap-2.5">
                <svg class="w-5 h-5 text-rose-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <span id="visitorErrorText">${isLocked ? `Слишком много неверных попыток. Блокировка на ${remSecs} сек.` : ''}</span>
              </div>

              <button
                type="submit"
                id="visitorSubmitBtn"
                ${isLocked ? 'disabled' : ''}
                class="w-full py-4 px-6 rounded-2xl btn-neon text-white font-bold text-sm sm:text-base flex items-center justify-center gap-2 cursor-pointer"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" />
                </svg>
                <span>Войти в панель</span>
              </button>
            </form>
          </div>
        </div>
      `;

      if (isLocked) {
        startLockoutTimer('visitor', 'visitorErrorText', 'panelPasswordInput', 'visitorSubmitBtn');
      }

      document.getElementById('visitorUnlockForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('panelPasswordInput');
        const errBox = document.getElementById('visitorErrorBox');
        const errText = document.getElementById('visitorErrorText');

        const result = await serverVerifyPanelPassword(input.value);
        if (!result.ok) {
          errBox.classList.remove('hidden');
          errText.textContent = result.error;
          input.value = '';
          input.focus();
          if (result.lockedOut) {
            input.disabled = true;
            document.getElementById('visitorSubmitBtn').disabled = true;
            startLockoutTimer('visitor', 'visitorErrorText', 'panelPasswordInput', 'visitorSubmitBtn');
          }
          return;
        }

        const panelData = serverGetAuthorizedPanel(result.panelId);
        if (panelData.authorized && panelData.files.length > 0) {
          selectedFileIdForRange = panelData.files[0].id;
          selectedRangeKey = panelData.files[0].question_count >= 50 ? '1-50' : 'ALL';
          selectedQuestionLimit = 'ALL';
        }

        showToast('Панель успешно разблокирована!', 'success');
        navigateTo(`/panel/${result.panelId}`);
      });
    }

    function startLockoutTimer(scope, textId, inputId, btnId) {
      if (lockoutTimerInterval) clearInterval(lockoutTimerInterval);
      lockoutTimerInterval = setInterval(() => {
        const rl = getRateLimitState(scope);
        const rem = Math.ceil((rl.lockoutUntil - Date.now()) / 1000);
        const textEl = document.getElementById(textId);
        if (rem <= 0) {
          clearInterval(lockoutTimerInterval);
          lockoutTimerInterval = null;
          resetRateLimit(scope);
          const inp = document.getElementById(inputId);
          const btn = document.getElementById(btnId);
          if (inp) inp.disabled = false;
          if (btn) btn.disabled = false;
          if (textEl) textEl.textContent = 'Блокировка снята. Попробуйте снова.';
        } else if (textEl) {
          textEl.textContent = `Слишком много неверных попыток. Блокировка на ${rem} сек.`;
        }
      }, 500);
    }

    function renderVisitorPanelWorkspace(root, panelId) {
      const data = serverGetAuthorizedPanel(panelId);

      if (!data.authorized) {
        root.innerHTML = `
          <div class="max-w-lg mx-auto mt-10 glass-card rounded-3xl p-8 text-center border border-rose-500/40 fade-in">
            <div class="w-14 h-14 rounded-2xl bg-rose-500/15 border border-rose-500/35 text-rose-400 flex items-center justify-center mx-auto mb-4">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
            <h2 class="text-xl font-bold text-white">Доступ ограничен</h2>
            <p class="text-sm text-slate-300 mt-2 leading-relaxed">${escapeHtml(data.reason)}</p>
            <button onclick="navigateTo('/')" class="mt-6 px-6 py-3 rounded-xl btn-neon text-white text-sm font-bold cursor-pointer">
              Вернуться к вводу пароля
            </button>
          </div>
        `;
        return;
      }

      const { panel, files } = data;
      if (files.length > 0 && !files.some(f => f.id === selectedFileIdForRange)) {
        selectedFileIdForRange = files[0].id;
        selectedRangeKey = files[0].question_count >= 50 ? '1-50' : 'ALL';
      }

      const activeFile = files.find(f => f.id === selectedFileIdForRange) || null;
      const totalInFile = activeFile ? activeFile.question_count : 0;
      const chunks = activeFile ? buildQuestionRanges(totalInFile) : [];

      let blockTotalQuestions = totalInFile;
      if (activeFile && selectedRangeKey !== 'ALL' && selectedRangeKey.includes('-')) {
        const [s, e] = selectedRangeKey.split('-').map(Number);
        blockTotalQuestions = Math.max(0, Math.min(e, totalInFile) - s + 1);
      }
      const effectiveQuestionCount = selectedQuestionLimit === 'ALL'
        ? blockTotalQuestions
        : Math.min(Number(selectedQuestionLimit), blockTotalQuestions);

      const stats = getVisitorStats(panel.id);
      const bestResultDisplay = stats.bestPct !== null
        ? `${stats.bestCorrect}/${stats.bestTotal} (${stats.bestPct}%)`
        : '—';

      const subjectIcons = [
        `<svg class="w-4 h-4 text-fuchsia-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>`,
        `<svg class="w-4 h-4 text-cyan-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>`,
        `<svg class="w-4 h-4 text-purple-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>`,
        `<svg class="w-4 h-4 text-emerald-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>`
      ];

      root.innerHTML = `
        <div class="max-w-2xl mx-auto space-y-5 fade-in pb-6">
          <!-- Карточки статистики -->
          <div class="space-y-3">
            <div class="glass-card rounded-2xl p-4 sm:p-5 border border-purple-500/25">
              <div class="text-xs font-medium text-slate-400">Вопросов в блоке</div>
              <div class="text-2xl sm:text-3xl font-black font-mono text-white mt-1">${effectiveQuestionCount}</div>
            </div>
            <div class="glass-card rounded-2xl p-4 sm:p-5 border border-purple-500/25">
              <div class="text-xs font-medium text-slate-400">Пройдено попыток</div>
              <div class="text-2xl sm:text-3xl font-black font-mono text-purple-200 mt-1">${stats.attempts}</div>
            </div>
            <div class="glass-card rounded-2xl p-4 sm:p-5 border border-purple-500/25">
              <div class="text-xs font-medium text-slate-400">Лучший результат</div>
              <div class="text-xl sm:text-2xl font-black font-mono bg-gradient-to-r from-emerald-300 to-cyan-300 bg-clip-text text-transparent mt-1.5">
                ${escapeHtml(bestResultDisplay)}
              </div>
            </div>
          </div>

          ${files.length === 0 ? `
            <div class="glass-card rounded-3xl p-10 text-center">
              <p class="text-slate-200 text-base font-bold">В этой панели пока нет загруженных тестов.</p>
              <p class="text-slate-400 text-xs mt-1">Администратор может загрузить до 8 файлов в Админ-панели.</p>
            </div>
          ` : `
            <!-- Основная карточка настроек теста -->
            <div class="glass-card rounded-3xl p-5 sm:p-7 space-y-6 border border-purple-400/30">

              <!-- 1. Предмет -->
              <div class="space-y-3">
                <div class="text-sm font-bold text-white">Предмет</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  ${files.map((f, idx) => {
                    const isSelected = activeFile && f.id === activeFile.id;
                    const iconSvg = subjectIcons[idx % subjectIcons.length];
                    return `
                      <button
                        type="button"
                        onclick="selectVisitorTestFile('${f.id}')"
                        class="p-3.5 sm:p-4 rounded-2xl border-2 text-left transition cursor-pointer flex items-center justify-between gap-2.5 ${
                          isSelected
                            ? 'border-fuchsia-400 bg-gradient-to-br from-violet-900/60 via-purple-900/50 to-fuchsia-900/35 shadow-[0_0_24px_rgba(168,85,247,0.28)]'
                            : 'border-purple-500/20 bg-[#080614]/75 hover:border-purple-400/45'
                        }"
                      >
                        <div class="flex items-center gap-2.5 min-w-0">
                          <div class="w-8 h-8 rounded-xl bg-purple-500/15 border border-purple-400/25 flex items-center justify-center shrink-0">
                            ${iconSvg}
                          </div>
                          <div class="font-bold text-white text-xs sm:text-sm leading-snug line-clamp-2">${escapeHtml(f.title)}</div>
                        </div>
                        <div class="font-mono text-xs text-slate-400 shrink-0">1–${f.question_count}</div>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>

              ${activeFile ? `
                <!-- 2. Выбор блока вопросов -->
                <div class="space-y-3">
                  <div class="text-sm font-bold text-white">Выберите блок вопросов</div>

                  <div class="grid grid-cols-2 gap-2.5">
                    ${chunks.map(ch => {
                      const active = selectedRangeKey === ch.key;
                      return `
                        <button
                          type="button"
                          onclick="chooseQuestionRange('${ch.key}')"
                          class="p-3.5 sm:p-4 rounded-2xl border-2 text-left transition cursor-pointer ${
                            active
                              ? 'border-fuchsia-400 bg-purple-600/25 shadow-[0_0_20px_rgba(168,85,247,0.28)]'
                              : 'border-purple-500/20 bg-[#080614]/75 hover:border-purple-400/45'
                          }"
                        >
                          <div class="font-mono font-extrabold text-sm sm:text-base ${active ? 'text-fuchsia-200' : 'text-white'}">
                            ${ch.label}
                          </div>
                          <div class="text-xs text-slate-400 mt-0.5">${ch.count} вопросов</div>
                        </button>
                      `;
                    }).join('')}
                  </div>

                  <button
                    type="button"
                    onclick="chooseQuestionRange('ALL')"
                    class="w-full p-4 rounded-2xl border-2 text-left transition cursor-pointer ${
                      selectedRangeKey === 'ALL'
                        ? 'border-fuchsia-400 bg-gradient-to-r from-violet-900/55 to-fuchsia-900/40 shadow-[0_0_22px_rgba(217,70,239,0.28)]'
                        : 'border-purple-500/20 bg-[#080614]/75 hover:border-purple-400/45'
                    }"
                  >
                    <div class="font-extrabold text-sm sm:text-base ${selectedRangeKey === 'ALL' ? 'text-fuchsia-200' : 'text-white'}">
                      Все вместе
                    </div>
                    <div class="text-xs text-slate-400 mt-0.5">
                      ${totalInFile} вопросов подряд или вперемешку

                  <div class="text-sm font-bold text-white">Режим проверки</div>

                  <div class="space-y-2.5">
                    <button
                      type="button"
                      onclick="chooseCheckMode('instant')"
                      class="w-full p-4 rounded-2xl border-2 text-left transition flex items-start gap-3.5 cursor-pointer ${
                        selectedCheckMode === 'instant'
                          ? 'border-fuchsia-400 bg-purple-600/20 shadow-[0_0_20px_rgba(168,85,247,0.22)]'
                          : 'border-purple-500/20 bg-[#080614]/75 hover:border-purple-400/45'
                      }"
                    >
                      <span class="mt-0.5 w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 ${
                        selectedCheckMode === 'instant' ? 'border-fuchsia-400' : 'border-slate-500'
                      }">
                        ${selectedCheckMode === 'instant' ? '<span class="w-2.5 h-2.5 rounded-full bg-fuchsia-400"></span>' : ''}
                      </span>
                      <div>
                        <div class="font-bold text-sm text-white">Обучение (сразу)</div>
                        <div class="text-xs text-slate-400 mt-0.5 leading-relaxed">
                          Правильный ответ показывается сразу, затем происходит автопереход
                        </div>
                      </div>
                    </button>

                    <button
                      type="button"
                      onclick="chooseCheckMode('exam')"
                      class="w-full p-4 rounded-2xl border-2 text-left transition flex items-start gap-3.5 cursor-pointer ${
                        selectedCheckMode === 'exam'
                          ? 'border-fuchsia-400 bg-purple-600/20 shadow-[0_0_20px_rgba(168,85,247,0.22)]'
                          : 'border-purple-500/20 bg-[#080614]/75 hover:border-purple-400/45'
                      }"
                    >
                      <span class="mt-0.5 w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 ${
                        selectedCheckMode === 'exam' ? 'border-fuchsia-400' : 'border-slate-500'
                      }">
                        ${selectedCheckMode === 'exam' ? '<span class="w-2.5 h-2.5 rounded-full bg-fuchsia-400"></span>' : ''}
                      </span>
                      <div>
                        <div class="font-bold text-sm text-white">Экзамен (в конце)</div>
                        <div class="text-xs text-slate-400 mt-0.5 leading-relaxed">
                          Сначала ответы на все вопросы с быстрой навигацией, затем разбор ошибок
                        </div>
                      </div>
                    </button>
                  </div>
                </div>

                <!-- 4. Количество вопросов -->
                <div class="space-y-3">
                  <div class="text-sm font-bold text-white">Количество вопросов</div>

                  <div class="flex flex-wrap gap-2">
                    ${[
                      { key: 'ALL', label: `Все (${blockTotalQuestions})` },
                      { key: '25', label: '25 случайных' },
                      { key: '15', label: '15 случайных' },
                      { key: '10', label: '10 случайных' }
                    ].map(pill => {
                      const active = selectedQuestionLimit === pill.key;
                      return `
                        <button
                          type="button"
                          onclick="chooseQuestionLimit('${pill.key}')"
                          class="px-4 py-2.5 rounded-xl border text-xs font-bold transition cursor-pointer ${

                              ? 'border-fuchsia-400 bg-fuchsia-500/25 text-fuchsia-200 shadow-[0_0_15px_rgba(217,70,239,0.25)]'
                              : 'border-purple-500/25 bg-[#080614]/75 text-slate-300 hover:border-purple-400/45'
                          }"
                        >
                          ${pill.label}
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>

                <!-- 5. Опциональный таймер -->
                <div class="space-y-3">
                  <div class="text-sm font-bold text-white">Таймер</div>

                  <div class="flex flex-wrap gap-2">
                    ${[
                      { mins: 0, label: 'Без таймера' },
                      { mins: 15, label: '15 минут' },
                      { mins: 30, label: '30 минут' },
                      { mins: 60, label: '60 минут' }
                    ].map(opt => {
                      const active = selectedTimerMinutes === opt.mins;
                      return `
                        <button
                          type="button"
                          onclick="chooseTimerMinutes(${opt.mins})"
                          class="px-4 py-2.5 rounded-xl border text-xs font-bold transition cursor-pointer ${
                            active
                              ? 'border-fuchsia-400 bg-fuchsia-500/25 text-fuchsia-200 shadow-[0_0_15px_rgba(217,70,239,0.25)]'
                              : 'border-purple-500/25 bg-[#080614]/75 text-slate-300 hover:border-purple-400/45'
                          }"
                        >
                          ${opt.label}
                        </button>
                      `;

                <!-- 6. Настройки перемешивания -->
                <div class="space-y-2.5 pt-1">
                  <label class="flex items-center gap-3 cursor-pointer select-none group">
                    <input
                      type="checkbox"
                      ${optShuffleQuestions ? 'checked' : ''}
                      onchange="optShuffleQuestions = this.checked; playSynthTone('click'); renderApp();"
                      class="w-5 h-5 rounded-md accent-fuchsia-500 cursor-pointer"
                    />
                    <span class="text-sm font-medium text-slate-200 group-hover:text-white transition">
                      Перемешивать порядок вопросов
                    </span>
                  </label>

                  <label class="flex items-center gap-3 cursor-pointer select-none group">
                    <input
                      type="checkbox"
                      ${optShuffleOptions ? 'checked' : ''}
                      onchange="optShuffleOptions = this.checked; playSynthTone('click'); renderApp();"
                      class="w-5 h-5 rounded-md accent-fuchsia-500 cursor-pointer"
                    />
                    <span class="text-sm font-medium text-slate-200 group-hover:text-white transition">
                      Перемешивать варианты ответов
                    </span>
                  </label>
                </div>

                <!-- 7. Кнопка старта -->
                <div class="pt-2">
                  <button
                    type="button"
                    onclick="launchConfiguredTest('${activeFile.id}')"
                    ${totalInFile === 0 ? 'disabled' : ''}
                    class="w-full py-4 px-6 rounded-2xl btn-neon text-white font-extrabold text-base flex items-center justify-center gap-2 cursor-pointer"
                  >
                    <span>Начать тест</span>
                  </button>
                </div>
              ` : ''}
            </div>
          `}
        </div>
      `;
    }

    function selectVisitorTestFile(fileId) {
      playSynthTone('click');
      selectedFileIdForRange = fileId;
      const file = DB.tests.find(t => t.id === fileId);
      const total = file ? DB.questions.filter(q => q.test_id === fileId).length : 0;
      selectedRangeKey = total >= 50 ? '1-50' : 'ALL';
      selectedQuestionLimit = 'ALL';
      renderApp();
    }

    function chooseQuestionRange(rangeKey) {
      playSynthTone('click');
      selectedRangeKey = rangeKey;
      renderApp();
    }

    function chooseCheckMode(mode) {
      playSynthTone('click');
      selectedCheckMode = mode;
      renderApp();
    }

    function chooseQuestionLimit(limitKey) {
      playSynthTone('click');
      selectedQuestionLimit = limitKey;
      renderApp();
    }

    function chooseTimerMinutes(mins) {
      playSynthTone('click');
      selectedTimerMinutes = mins;
      renderApp();
    }

    function launchConfiguredTest(fileId) {
      playSynthTone('click');
      const file = DB.tests.find(t => t.id === fileId);
      if (!file) return;
      const total = DB.questions.filter(q => q.test_id === fileId).length;
      if (total === 0) {
        showToast('В этом файле пока нет вопросов.', 'error');
        return;
      }

      let start = 1;
      let end = total;
      let rangeLabel = `Все вместе (1–${total})`;

      if (selectedRangeKey !== 'ALL' && selectedRangeKey.includes('-')) {
        const [s, e] = selectedRangeKey.split('-').map(Number);
        start = s;
        end = Math.min(e, total);
        rangeLabel = `Блок ${start}–${end}`;
      }

      const config = {
        rangeStart: start,
        rangeEnd: end,
        rangeLabel,
        checkMode: selectedCheckMode,
        questionLimit: selectedQuestionLimit,
        timerMinutes: selectedTimerMinutes,
        shuffleQuestions: optShuffleQuestions,
        shuffleOptions: optShuffleOptions
      };

      const sessionObj = serverCreateConfiguredExamSession(fileId, config);
      if (!sessionObj.authorized) {
        showToast(sessionObj.reason, 'error');
        return;
      }

      examReviewFilter = 'all';
      activeExam = {
        panelId: sessionObj.panel.id,
        panelTitle: sessionObj.panel.title,
        panelIndex: sessionObj.panel.panel_index,
        fileId: sessionObj.file.id,
        fileTitle: sessionObj.file.title,
        config,
        questions: sessionObj.questions,
        currentIndex: 0,
        answers: {},
        lockedQuestions: {},
        startedAt: Date.now(),
        elapsedSeconds: 0,
        timerTotalSeconds: config.timerMinutes > 0 ? config.timerMinutes * 60 : 0,
        timedOut: false,
        submitted: false,
        scoreResult: null
      };

      startExamTimer();
      navigateTo('/exam');
    }

    /**
     * ============================================================================
     * 6. ПРОХОЖДЕНИЕ ТЕСТА, НАВИГАЦИЯ ПО ВОПРОСАМ И РАЗБОР РЕЗУЛЬТАТОВ
     * ============================================================================
     */
    function setExamReviewFilter(filterMode) {
      playSynthTone('click');
      examReviewFilter = filterMode;
      renderApp();
    }

    function retryMistakesOnly() {
      if (!activeExam || !activeExam.scoreResult) return;
      const wrongItems = activeExam.scoreResult.details.filter(d => !d.isCorrect);
      if (wrongItems.length === 0) {
        showToast('Ошибок нет — все ответы верны!', 'info');
        return;
      }

      playSynthTone('click');
      const baseConfig = {
        ...activeExam.config,
        rangeLabel: `Работа над ошибками (${wrongItems.length})`
      };

      let pool = wrongItems.map((item, idx) => ({
        exam_seq: idx + 1,
        question_id: item.question_id || `mistake_${idx + 1}`,
        question_text: item.question_text,
        options: baseConfig.shuffleOptions ? shuffleArray(item.options) : [...item.options]
      }));

      if (baseConfig.shuffleQuestions) {
        pool = shuffleArray(pool);
      }

      examReviewFilter = 'all';
      activeExam = {
        panelId: activeExam.panelId,
        panelTitle: activeExam.panelTitle,
        panelIndex: activeExam.panelIndex,
        fileId: activeExam.fileId,
        fileTitle: activeExam.fileTitle,
        config: baseConfig,
        questions: pool,
        currentIndex: 0,
        answers: {},
        lockedQuestions: {},
        startedAt: Date.now(),
        elapsedSeconds: 0,
        timerTotalSeconds: baseConfig.timerMinutes > 0 ? baseConfig.timerMinutes * 60 : 0,
        timedOut: false,
        submitted: false,
        scoreResult: null
      };

      startExamTimer();
      showToast(`Запущена тренировка по ошибкам (${pool.length} вопросов).`, 'success');
      renderApp();
    }

                      class="flex-1 sm:flex-initial px-4 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 disabled:opacity-35 border border-purple-400/30 text-xs font-semibold text-slate-200 cursor-pointer"
                    >

                    </button>
                    ${activeExam.currentIndex < totalQs - 1 ? `
                      <button
                        type="button"
                        onclick="moveExamQuestion(${activeExam.currentIndex + 1})"
                        class="flex-1 sm:flex-initial px-5 py-2.5 rounded-xl bg-purple-600/35 hover:bg-purple-600/50 border border-purple-400/40 text-xs font-bold text-white cursor-pointer"
                      >
                        Следующий →
                      </button>
                    ` : ''}
                  </div>
                ` : `
                  <div class="text-xs text-slate-400">
                    ${isRevealed ? 'Переход к следующему вопросу...' : 'Выберите вариант ответа'}
                  </div>
                `}

                <button
                  type="button"
                  onclick="finishAndGradeExam()"
                  class="w-full sm:w-auto px-6 py-3 rounded-xl btn-neon text-white text-xs sm:text-sm font-extrabold cursor-pointer"
                >
                  Завершить тест
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function chooseExamAnswer(questionId, optionIdx) {
      if (!activeExam || activeExam.submitted) return;
      if (activeExam.config.checkMode === 'instant' && activeExam.lockedQuestions[questionId]) return;

      activeExam.answers[questionId] = optionIdx;

      if (activeExam.config.checkMode === 'instant') {
        activeExam.lockedQuestions[questionId] = true;
        const q = activeExam.questions[activeExam.currentIndex];
        const isRight = q && q.options[optionIdx] && q.options[optionIdx].isCorrect;
        playSynthTone(isRight ? 'correct' : 'wrong');
        renderApp();

        if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = setTimeout(() => {
          if (!activeExam || activeExam.submitted) return;
          if (activeExam.currentIndex < activeExam.questions.length - 1) {
            activeExam.currentIndex += 1;
            renderApp();
          } else {
            finishAndGradeExam(true);
          }
        }, 950);
      } else {
        playSynthTone('click');
        renderApp();
      }
    }

    function moveExamQuestion(idx) {
      if (!activeExam) return;
      if (idx >= 0 && idx < activeExam.questions.length) {
        playSynthTone('click');
        activeExam.currentIndex = idx;
        renderApp();
      }
    }

    function exitActiveExam() {
      stopExamTimer();
      if (autoAdvanceTimer) {
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = null;
      }
      const pId = activeExam ? activeExam.panelId : null;
      activeExam = null;
      navigateTo(pId ? `/panel/${pId}` : '/');
    }

    function retakeCurrentExam() {
      if (!activeExam) return;
      const { fileId, config } = activeExam;
      const freshSession = serverCreateConfiguredExamSession(fileId, config);
      if (freshSession.authorized) {
        playSynthTone('click');
        examReviewFilter = 'all';
        activeExam = {
          panelId: freshSession.panel.id,
          panelTitle: freshSession.panel.title,
          panelIndex: freshSession.panel.panel_index,
          fileId: freshSession.file.id,
          fileTitle: freshSession.file.title,
          config,
          questions: freshSession.questions,
          currentIndex: 0,
          answers: {},
          lockedQuestions: {},
          startedAt: Date.now(),
          elapsedSeconds: 0,
          timerTotalSeconds: config.timerMinutes > 0 ? config.timerMinutes * 60 : 0,
          timedOut: false,
          submitted: false,
          scoreResult: null
        };
        startExamTimer();
        showToast('Тест запущен заново!', 'success');
        renderApp();
      }
    }

    function finishAndGradeExam(skipPrompt = false, timedOut = false) {
      if (!activeExam || activeExam.submitted) return;
      if (autoAdvanceTimer) {
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = null;
      }

      const unanswered = activeExam.questions.filter(q => activeExam.answers[q.question_id] === undefined).length;

      const executeGrade = () => {
        stopExamTimer();
        const elapsedSeconds = Math.floor((Date.now() - activeExam.startedAt) / 1000);
        let correct = 0;
        const details = activeExam.questions.map(q => {
          const chosen = activeExam.answers[q.question_id] !== undefined ? activeExam.answers[q.question_id] : null;
          const isCorrect = chosen !== null && q.options[chosen] && q.options[chosen].isCorrect === true;
          if (isCorrect) correct++;
          return {
            question_id: q.question_id,
            question_text: q.question_text,
            options: q.options,
            chosenIndex: chosen,
            isCorrect
          };
        });

        const total = activeExam.questions.length;
        const percentage = total > 0 ? Math.round((correct / total) * 100) : 0;

        recordVisitorAttempt(activeExam.panelId, correct, total);
        playSynthTone('finish');

        activeExam.submitted = true;
        activeExam.timedOut = timedOut;
        activeExam.elapsedSeconds = elapsedSeconds;
        examReviewFilter = 'all';
        activeExam.scoreResult = {
          correct,
          total,
          percentage,
          elapsedSeconds,
          details
        };
        renderApp();
        showToast(
          timedOut
            ? `Время вышло! Правильно ${correct} из ${total} (${percentage}%)`
            : `Правильно ${correct} из ${total} (${percentage}%)`,
          timedOut ? 'info' : 'success'
        );
      };

      if (!skipPrompt && unanswered > 0) {
        openConfirmModal({
          title: 'Завершить тест?',
          message: `Вы не ответили на ${unanswered} вопрос(ов). Неотвеченные вопросы будут засчитаны как ошибочные.`,
          confirmText: 'Завершить и проверить',
          confirmVariant: 'primary',
          onConfirm: executeGrade
        });
      } else {
        executeGrade();
      }
    }

        const errBox = document.getElementById('adminErrorAlert');
        const errText = document.getElementById('adminErrorAlertText');

        const enteredHash = await sha256Hex((inp.value || '').trim());
        if (enteredHash === ADMIN_PASSWORD_HASH) {
          resetRateLimit('admin');
          setAdminAuthenticated(true);
          showToast('Вы вошли в Админ-панель ZAGAFOX.', 'success');

      const pFiles = DB.tests.filter(t => t.section_id === panelId);
      const fileIds = new Set(pFiles.map(f => f.id));
      const qCount = DB.questions.filter(q => fileIds.has(q.test_id)).length;

      openConfirmModal({
        title: `Удалить «Панель ${p.panel_index} — ${p.title}»?`,
        message: `Будут безвозвратно удалены сама панель, ${pFiles.length} загруженных файлов и ${qCount} вопросов.`,
        confirmText: 'Удалить панель',
        confirmVariant: 'danger',
        onConfirm: () => {
          DB.questions = DB.questions.filter(q => !fileIds.has(q.test_id));
          DB.tests = DB.tests.filter(t => t.section_id !== panelId);
          DB.sections = DB.sections.filter(s => s.id !== panelId);
          ephemeralPlainPasswords.delete(panelId);
          const vis = getVisitorSession();
          if (vis && vis.section_id === panelId) {
            safeSessionRemove(VISITOR_SESSION_KEY);
          }
          saveDatabase();
          showToast(`Панель ${p.panel_index} удалена.`, 'success');
          navigateTo('/admin');
        }
      });
    }

    function getNextPanelNumbers() {
      const maxIdx = DB.sections.reduce((acc, s) => Math.max(acc, s.panel_index || 0), 0);
      const nextIdx = maxIdx + 1;
      return {
        panel_index: nextIdx,
        section_number: String(nextIdx).padStart(3, '0')
      };
    }

    function generateRandomPanelKey() {
      const digits = Math.floor(1000000 + Math.random() * 9000000);
      return `Zzz_${digits}`;
    }

    function openCreatePanelModal() {
      const { panel_index, section_number } = getNextPanelNumbers();

      openModal(`

            <p class="text-[11px] text-slate-400 mt-1">Пароль сохраняется в базе данных в виде криптографического хэша SHA-256.</p>

          <div class="pt-4 border-t border-purple-500/20 flex items-center justify-end gap-2">

          </div>
        </form>

      document.getElementById('createPanelForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('newPanelTitle').value.trim();
        const desc = document.getElementById('newPanelDesc').value.trim();
        const plainPass = document.getElementById('newPanelPass').value.trim();
        if (!title || !plainPass) return;

        const passHash = await sha256Hex(plainPass);
        if (passHash === ADMIN_PASSWORD_HASH || DB.sections.some(s => s.password_hash === passHash)) {
          showToast('Этот пароль уже используется. Введите уникальный пароль.', 'error');
          return;
        }

        const today = formatDateDDMMYYYY();
        const newPanel = {
          id: generateId('panel'),
          section_number,
          panel_index,
          title,
          description: desc,
          password_hash: passHash,
          password_enabled: true,
          status: 'Published',
          created_at: today,
          updated_at: today

        DB.sections.push(newPanel);
        ephemeralPlainPasswords.set(newPanel.id, plainPass);

      adminQuestionPage = 1;

        inp.setSelectionRange(val.length, val.length);
