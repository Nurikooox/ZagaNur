                    ← Назад
                  </button>
                  <span class="px-3 py-1.5 font-mono text-xs text-purple-200 font-bold">
                    Стр. ${adminQuestionPage} / ${totalPages}
                  </span>
                  <button
                    type="button"
                    onclick="setAdminQuestionPage(${adminQuestionPage + 1})"
                    ${adminQuestionPage >= totalPages ? 'disabled' : ''}
                    class="px-3 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 disabled:opacity-35 border border-purple-400/30 text-xs font-semibold text-slate-200 cursor-pointer"
                  >
                    Вперёд →
                  </button>
                </div>
              </div>
            ` : ''}
          `}
        </div>
      `;
    }

    function openEditQuestionModal(questionId, fileId) {
      const file = DB.tests.find(t => t.id === fileId);
      if (!file) return;
      const existing = questionId ? DB.questions.find(q => q.id === questionId) : null;
      const opts = existing ? [...existing.answer_options] : ['', '', '', '', ''];
      while (opts.length < 4) opts.push('');
      const correctIdx = existing ? (existing.correct_answer ?? 0) : 0;

      openModal(`
        <div class="p-6 border-b border-purple-500/20 flex items-center justify-between">
          <div>
            <span class="text-xs font-mono font-bold text-fuchsia-300">${existing ? `ВОПРОС #${existing.original_question_number}` : 'НОВЫЙ ВОПРОС'}</span>
            <h2 class="text-lg font-extrabold text-white">${existing ? 'Редактировать вопрос' : 'Добавить вопрос вручную'}</h2>
          </div>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1 cursor-pointer">✕</button>
        </div>

        <form id="editQuestionForm" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
          <div>
            <label class="block text-xs font-bold text-purple-300 mb-1.5">Текст вопроса *</label>
            <textarea id="editQuestionText" rows="3" required class="w-full px-4 py-3 rounded-xl bg-[#070510]/85 border border-purple-500/35 text-white text-sm outline-none focus:border-fuchsia-400">${existing ? escapeHtml(existing.question_text) : ''}</textarea>
          </div>

          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <label class="text-xs font-bold text-purple-300">Варианты ответов (отметьте правильный)</label>
              <span class="text-[11px] text-slate-400">Минимум 2 варианта</span>
            </div>
            ${[0, 1, 2, 3, 4, 5].map(idx => {
              const val = opts[idx] || '';
              return `
                <div class="flex items-center gap-2.5">
                  <input
                    type="radio"
                    name="correctOptionRadio"
                    value="${idx}"
                    ${correctIdx === idx ? 'checked' : ''}
                    class="w-4 h-4 accent-emerald-500 cursor-pointer shrink-0"
                    title="Сделать вариант ${getOptionLetter(idx)} правильным"
                  />
                  <span class="w-7 h-7 rounded-lg bg-purple-500/15 border border-purple-500/30 font-mono text-xs font-bold text-purple-200 flex items-center justify-center shrink-0">
                    ${getOptionLetter(idx)}
                  </span>
                  <input
                    type="text"
                    id="editOptInput_${idx}"
                    value="${escapeHtml(val)}"
                    placeholder="Вариант ${getOptionLetter(idx)}${idx < 2 ? ' (обязательно)' : ' (необязательно)'}"
                    class="flex-1 px-3.5 py-2.5 rounded-xl bg-[#070510]/85 border border-purple-500/30 text-white text-xs sm:text-sm outline-none focus:border-fuchsia-400"
                  />
                </div>
              `;
            }).join('')}
          </div>

          <div class="pt-4 border-t border-purple-500/20 flex items-center justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-white/5 text-xs font-semibold text-slate-300 cursor-pointer">Отмена</button>
            <button type="submit" class="px-6 py-2.5 rounded-xl btn-neon text-white text-xs font-bold cursor-pointer">Сохранить вопрос</button>
          </div>
        </form>
      `);

      document.getElementById('editQuestionForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const qText = document.getElementById('editQuestionText').value.trim();
        if (!qText) {
          showToast('Введите текст вопроса.', 'error');
          return;
        }

        const radioEl = document.querySelector('input[name="correctOptionRadio"]:checked');
        const chosenRawIdx = radioEl ? parseInt(radioEl.value, 10) : 0;

        const collected = [];
        let mappedCorrectIdx = 0;
        for (let i = 0; i < 6; i++) {
          const v = document.getElementById(`editOptInput_${i}`).value.trim();
          if (v) {
            if (i === chosenRawIdx) {
              mappedCorrectIdx = collected.length;
            }
            collected.push(v);
          }
        }

        if (collected.length < 2) {
          showToast('Укажите минимум 2 варианта ответа.', 'error');
          return;
        }

        const today = formatDateDDMMYYYY();
        if (existing) {
          existing.question_text = qText;
          existing.answer_options = collected;
          existing.correct_answer = mappedCorrectIdx;
          existing.updated_at = today;
        } else {
          const maxNum = DB.questions
            .filter(q => q.test_id === file.id)
            .reduce((acc, q) => Math.max(acc, q.original_question_number || 0), 0);
          DB.questions.push({
            id: generateId('q'),
            test_id: file.id,
            original_question_number: maxNum + 1,
            question_text: qText,
            answer_options: collected,
            correct_answer: mappedCorrectIdx,
            created_at: today,
            updated_at: today
          });
        }

        file.updated_at = today;
        saveDatabase();
        closeModal();
        showToast(existing ? 'Вопрос обновлён.' : 'Новый вопрос добавлен.', 'success');
        renderApp();
      });
    }

    function confirmDeleteQuestion(questionId, fileId) {
      const q = DB.questions.find(item => item.id === questionId);
      if (!q) return;

      openConfirmModal({
        title: `Удалить вопрос #${q.original_question_number}?`,
        message: `Вопрос «${q.question_text.slice(0, 120)}${q.question_text.length > 120 ? '...' : ''}» будет удалён из этого слота.`,
        confirmText: 'Удалить вопрос',
        confirmVariant: 'danger',
        onConfirm: () => {
          DB.questions = DB.questions.filter(item => item.id !== questionId);
          // Перенумеровываем оставшиеся вопросы по порядку
          const remaining = DB.questions
            .filter(item => item.test_id === fileId)
            .sort((a, b) => a.original_question_number - b.original_question_number);
          remaining.forEach((item, idx) => {
            item.original_question_number = idx + 1;
          });
          const file = DB.tests.find(t => t.id === fileId);
          if (file) file.updated_at = formatDateDDMMYYYY();
          saveDatabase();
          showToast('Вопрос удалён.', 'success');
          renderApp();
        }
      });
    }

    /**
     * Загрузка или замена файла в слоте (1..8)
     */
    function openUploadFileSlotModal(panelId, slotNum, existingFileId) {
      const panel = DB.sections.find(s => s.id === panelId);
      if (!panel) return;
      const existingFile = existingFileId ? DB.tests.find(t => t.id === existingFileId) : null;

      openModal(`
        <div class="p-6 border-b border-purple-500/20 flex items-center justify-between">
          <div>
            <span class="text-xs font-mono font-bold text-fuchsia-300">ПАНЕЛЬ ${panel.panel_index} • СЛОТ ${slotNum} ИЗ 8</span>
            <h2 class="text-lg font-extrabold text-white">${existingFile ? 'Заменить тестовый файл' : 'Загрузить новый тестовый файл'}</h2>
          </div>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1 cursor-pointer">✕</button>
        </div>

        <form id="slotFileUploadForm" class="p-6 space-y-4">
          <div>
            <label class="block text-xs font-bold text-purple-300 mb-1.5">Название теста (отображается пользователям) *</label>
            <input
              type="text"
              id="slotTestTitleInput"
              required
              value="${existingFile ? escapeHtml(existingFile.title) : ''}"
              placeholder="Например: Органическая химия (300 вопросов)"
              class="w-full px-4 py-3 rounded-xl bg-[#070510]/85 border border-purple-500/35 text-white text-sm outline-none focus:border-fuchsia-400"
            />
          </div>

          <div class="p-4 rounded-2xl bg-purple-950/30 border border-purple-400/30 space-y-2.5">
            <label class="block text-xs font-bold text-purple-200">Выберите файл Word (.docx, .doc, .rtf) или .txt *</label>
            <input
              type="file"
              id="slotRawFileInput"
              accept=".docx,.doc,.rtf,.txt"
              required
              onchange="if (this.files && this.files[0]) { const t = document.getElementById('slotTestTitleInput'); if (t && !t.value.trim()) t.value = this.files[0].name.replace(/\.[^.]+$/, ''); }"
              class="w-full text-xs text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-fuchsia-600 file:text-white hover:file:bg-fuchsia-500 cursor-pointer"
            />
            <p class="text-[11px] text-slate-400 leading-relaxed">
              Загружается любой тест Word: с нумерацией, автосписками Word, тегами или просто текстом (1 вопрос + 5 ответов). Первый вариант (<strong class="text-emerald-300">А</strong>) всегда считается правильным, а вопросы автоматически делятся на блоки по 50.
            </p>
          </div>

          <div class="pt-4 border-t border-purple-500/20 flex items-center justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-white/5 text-xs font-semibold text-slate-300 cursor-pointer">Отмена</button>
            <button type="submit" class="px-6 py-2.5 rounded-xl btn-neon text-white text-xs font-bold cursor-pointer">
              ${existingFile ? 'Заменить и сохранить' : 'Загрузить в слот ' + slotNum}
            </button>
          </div>
        </form>
      `);

      document.getElementById('slotFileUploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('slotTestTitleInput').value.trim();
        const fileInput = document.getElementById('slotRawFileInput');
        const file = fileInput.files && fileInput.files[0];

        if (!title || !file) {
          showToast('Укажите название теста и выберите файл.', 'error');
          return;
        }

        try {
          const rawText = await extractTextFromUploadedFile(file);
          const parsedQuestions = parseTestQuestionsFromRawText(rawText);

          if (parsedQuestions.length === 0) {
            showToast('Не удалось распознать вопросы. Проверьте формат нумерации (1. ... А) ... Б/В) ...).', 'error');
            return;
          }

          const autoBlocks = buildQuestionRanges(parsedQuestions.length);
          const today = formatDateDDMMYYYY();
          let targetTestId = existingFileId;

          if (existingFile) {
            existingFile.title = title;
            existingFile.file_name = file.name;
            existingFile.description = `Автоматически разделено на ${autoBlocks.length} блок(ов) по 50 вопросов (всего ${parsedQuestions.length}).`;
            existingFile.updated_at = today;
            DB.questions = DB.questions.filter(q => q.test_id !== existingFile.id);
          } else {
            if (DB.tests.filter(t => t.section_id === panelId).length >= 8) {
              showToast('Данный раздел достиг максимального лимита в 8 тестов.', 'error');
              return;
            }
            targetTestId = generateId('file');
            DB.tests.push({
              id: targetTestId,
              section_id: panelId,
              test_number: slotNum,
              title,
              file_name: file.name,
              description: `Автоматически разделено на ${autoBlocks.length} блок(ов) по 50 вопросов (всего ${parsedQuestions.length}).`,
              question_count: parsedQuestions.length,
              status: 'Published',
              created_at: today,
              updated_at: today
            });
          }

          parsedQuestions.forEach((pq, idx) => {
            DB.questions.push({
              id: generateId('q'),
              test_id: targetTestId,
              original_question_number: pq.original_question_number || (idx + 1),
              question_text: pq.question_text,
              answer_options: pq.answer_options,
              correct_answer: 0,
              created_at: today,
              updated_at: today
            });
          });

          saveDatabase();
          closeModal();
          showToast(`Файл «${file.name}» загружен: ${parsedQuestions.length} вопросов (блоков по 50: ${autoBlocks.length})!`, 'success');
          renderApp();
        } catch (err) {
          showToast(`Ошибка чтения файла: ${err.message}`, 'error');
        }
      });
    }

    function openRenameFileModal(fileId) {
      const file = DB.tests.find(t => t.id === fileId);
      if (!file) return;

      openModal(`
        <div class="p-6 border-b border-purple-500/20 flex items-center justify-between">
          <h2 class="text-lg font-extrabold text-white">Переименовать тест (Слот ${file.test_number})</h2>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1 cursor-pointer">✕</button>
        </div>
        <form id="renameFileForm" class="p-6 space-y-4">
          <div>
            <label class="block text-xs font-bold text-purple-300 mb-1.5">Новое название теста *</label>
            <input type="text" id="renameFileInput" required value="${escapeHtml(file.title)}" class="w-full px-4 py-3 rounded-xl bg-[#070510]/85 border border-purple-500/35 text-white text-sm outline-none" />
          </div>
          <div class="pt-4 border-t border-purple-500/20 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-white/5 text-xs font-semibold text-slate-300 cursor-pointer">Отмена</button>
            <button type="submit" class="px-5 py-2 rounded-xl btn-neon text-white text-xs font-bold cursor-pointer">Сохранить</button>
          </div>
        </form>
      `);

      document.getElementById('renameFileForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const val = document.getElementById('renameFileInput').value.trim();
        if (!val) return;
        file.title = val;
        file.updated_at = formatDateDDMMYYYY();
        saveDatabase();
        closeModal();
        showToast('Название теста обновлено.', 'success');
        renderApp();
      });
    }

    function confirmDeleteTestFile(fileId) {
      const file = DB.tests.find(t => t.id === fileId);
      if (!file) return;
      const qCount = DB.questions.filter(q => q.test_id === fileId).length;

      openConfirmModal({
        title: `Удалить файл из Слота ${file.test_number}?`,
        message: `Тест «${file.title}» и все ${qCount} вопросов в нём будут удалены, а Слот ${file.test_number} освободится.`,
        confirmText: 'Удалить файл',
        confirmVariant: 'danger',
        onConfirm: () => {
          DB.questions = DB.questions.filter(q => q.test_id !== fileId);
          DB.tests = DB.tests.filter(t => t.id !== fileId);
          saveDatabase();
          showToast(`Файл удалён. Слот ${file.test_number} теперь свободен.`, 'success');
          renderApp();
        }
      });
    }

    /**
     * ============================================================================
     * 9. ВСПОМОГАТЕЛЬНЫЕ UI-ФУНКЦИИ (Модальные окна, уведомления, буфер обмена)
     * ============================================================================
     */
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function togglePasswordVisibility(inputId) {
      const inp = document.getElementById(inputId);
      if (inp) {
        inp.type = inp.type === 'password' ? 'text' : 'password';
      }
    }

    function copyTextToClipboard(text, successMsg = 'Скопировано!') {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(successMsg, 'success');
      } catch {
        showToast('Не удалось скопировать.', 'error');
      }
      document.body.removeChild(ta);
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const styles = {
        success: 'bg-emerald-950/90 border-emerald-400/50 text-emerald-200 shadow-[0_0_20px_rgba(16,185,129,0.25)]',
        error: 'bg-rose-950/90 border-rose-400/50 text-rose-200 shadow-[0_0_20px_rgba(244,63,94,0.25)]',
        info: 'bg-[#130d2b]/95 border-purple-400/40 text-purple-100 shadow-[0_0_20px_rgba(168,85,247,0.25)]'
      };
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-3 rounded-2xl border backdrop-blur-md text-xs font-semibold fade-in ${styles[type] || styles.info}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.22s';
        setTimeout(() => toast.remove(), 240);
      }, 3400);
    }

    function openModal(html) {
      const backdrop = document.getElementById('modalBackdrop');
      const content = document.getElementById('modalContent');
      content.innerHTML = html;
      backdrop.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.add('hidden');
    }

    function openConfirmModal({ title, message, confirmText = 'Подтвердить', confirmVariant = 'primary', onConfirm }) {
      const btnStyle = confirmVariant === 'danger'
        ? 'bg-rose-600 hover:bg-rose-500 text-white shadow-[0_0_20px_rgba(225,29,72,0.4)]'
        : 'btn-neon text-white';

      openModal(`
        <div class="p-6 space-y-4">
          <h3 class="text-lg font-extrabold text-white">${escapeHtml(title)}</h3>
          <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">${escapeHtml(message)}</p>
          <div class="pt-4 border-t border-purple-500/20 flex items-center justify-end gap-2">
            <button type="button" id="modalCancelBtn" class="px-4 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-xs font-semibold text-slate-300 cursor-pointer">
              Отмена
            </button>
            <button type="button" id="modalConfirmBtn" class="px-5 py-2.5 rounded-xl text-xs font-bold transition cursor-pointer ${btnStyle}">
              ${escapeHtml(confirmText)}
            </button>
          </div>
        </div>
      `);

      document.getElementById('modalCancelBtn').onclick = closeModal;
      document.getElementById('modalConfirmBtn').onclick = () => {
        closeModal();
        if (onConfirm) onConfirm();
      };
    }

    // Запуск приложения
    window.addEventListener('DOMContentLoaded', async () => {
      await initDatabase();
      const initialHash = window.location.hash.replace(/^#/, '');
      if (initialHash) {
        currentRoute = initialHash;
      }
      renderApp();
    });
  </script>
</body>
</html>
